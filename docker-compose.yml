version: "3.8"

services:
  spellbinder:
    build: .
    ports:
      - "10601:10601/udp"
      - "10602:10602/tcp"
    volumes:
      # Mount game content from host (Spells.dat, Arenas.dat, Grids/, etc.)
      # Download from the Internet Archive SpellBinder installer
      - ./Content:/app/Content
      # Persist database and credentials across restarts
      - spellbinder-data:/var/lib/mysql
      - ./credentials.txt:/app/credentials.txt
    restart: unless-stopped

volumes:
  spellbinder-data:
